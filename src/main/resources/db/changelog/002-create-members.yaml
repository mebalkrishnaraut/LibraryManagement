databaseChangeLog:
  - changeSet:
      id: 002-create-members-table
      author: library
      changes:
        - createTable:
            tableName: members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true

              - column:
                  name: phone
                  type: VARCHAR(20)
