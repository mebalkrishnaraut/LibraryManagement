databaseChangeLog:
  - changeSet:
      id: 003-create-borrow-transactions-table
      author: library
      changes:
        - createTable:
            tableName: borrow_transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: borrowed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: returned_at
                  type: TIMESTAMP
