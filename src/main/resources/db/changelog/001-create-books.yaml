databaseChangeLog:
  - changeSet:
      id: 001-create-books-table
      author: library
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: author
                  type: VARCHAR(255)

              - column:
                  name: isbn
                  type: VARCHAR(100)

              - column:
                  name: total_copies
                  type: INT

              - column:
                  name: available_copies
                  type: INT
